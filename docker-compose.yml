version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: alzara_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alzara
      POSTGRES_PASSWORD: alzara_password
      POSTGRES_DB: alzara_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alzara -d alzara_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
